  <style>

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }

      color: var(--fg);

      margin: 0 auto;
      padding: 56px 24px 96px;
    }

      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 56px;
      align-items: start;
    }
    main { min-width: 0; }

    nav.toc {
      position: sticky;
      top: 40px;
      font-size: 14px;
      line-height: 1.5;
    }
    nav.toc ol {
      list-style: none;
      margin: 0;
      padding: 0;
      border-left: 1px solid var(--line);
    }
    nav.toc li { margin: 0; }
    nav.toc a {
      display: block;
      padding: 5px 0 5px 14px;
      margin-left: -1px;
      border-left: 1px solid transparent;
      color: var(--muted);
      text-decoration: none;
    }
    nav.toc a:hover { color: var(--fg); }
    nav.toc a.active {
      color: var(--fg);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; gap: 8px; }
      nav.toc { position: static; margin-bottom: 24px; }
      nav.toc ol {
        display: flex;
        flex-wrap: wrap;
        gap: 0 14px;
        border-left: 0;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
      }
      nav.toc a { padding: 2px 0; border-left: 0; margin-left: 0; }
      nav.toc a.active { border-left: 0; }
    }

    header { margin-bottom: 8px; }
    header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

      scroll-margin-top: 24px;
      margin-top: 52px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }
    .project:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
    .project h2 {
      margin: 0 0 16px -12px;
      padding: 7px 12px;
      background: var(--title-bg);
      border-radius: 6px;
      font-size: 22px;
      letter-spacing: -0.01em;
      font-weight: 700;
    }
    .project p {
      margin: 0 0 14px;
    }
    p.deps {
      margin: -4px 0 16px;
      font-size: 13.5px;
      color: var(--muted);
    }
    p.deps a { color: var(--accent); text-decoration: none; }
    p.deps a:hover { text-decoration: underline; }
    .dep-label { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
    .project p:last-of-type { margin-bottom: 22px; }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em;
      background: var(--line);
      padding: 1px 4px;
      border-radius: 4px;
    }

    ul.work {
      list-style: none;
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }
    ul.work li {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
      line-height: 1.5;
    }

      color: var(--fg);
      text-decoration: none;

      color: var(--muted);
    }
    ul.work .links {

      white-space: nowrap;
    }
    ul.work .links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }

      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    .viewbar {
      display: inline-flex;
      gap: 4px;
      margin-top: 16px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;

      font: inherit;
      font-size: 13px;
      padding: 4px 14px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);

    .viewbar button.active {
      background: var(--title-bg);
      color: var(--fg);
      font-weight: 600;

      scroll-margin-top: 24px;
      margin-top: 52px;
      padding-top: 28px;
      border-top: 1px solid var(--line);

      font-size: 22px;

      font-weight: 700;

      color: var(--muted);
      font-size: 13.5px;
    }
    .day h3 {

      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
    }
    ul.entries {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }
    ul.entries li {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
      line-height: 1.5;
    }
    .kind {
      display: inline-block;
      min-width: 74px;
      margin-right: 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;

  <script>

    const DATA = JSON.parse(document.getElementById('data-consolidated').textContent);
    const TIME = JSON.parse(document.getElementById('data-timeline').textContent);
    const PRES = JSON.parse(document.getElementById('data-presentations').textContent);

    const secById = new Map(DATA.sections.map(s => [s.id, s]));
    const rowById = new Map();
    for (const s of DATA.sections)
      for (const r of s.rows) rowById.set(s.id + '/' + r.id, r);

    const linksHtml = (links) => !links || !links.length ? '' :
      ' <span class="links">' +
      links.map(l => '<a href="' + l.href + '">' + l.label + '</a>').join('<span class="sep"> · </span>') +
      '</span>';

    /* ---------- consolidated ---------- */
    function depsHtml(s) {
      const on = (s.deps?.dependsOn || []).filter(id => secById.has(id));
      const by = (s.deps?.neededBy  || []).filter(id => secById.has(id));
      if (!on.length && !by.length) return '';
      const link = id => '<a href="#' + id + '" data-goto="' + id + '">' + secById.get(id).title + '</a>';
      const parts = [];
      if (on.length) parts.push('<span class="dep-label">Depends on</span> ' + on.map(link).join(', '));
      if (by.length) parts.push('<span class="dep-label">Needed by</span> ' + by.map(link).join(', '));
      return '<p class="deps">' + parts.join(' <span class="sep">·</span> ') + '</p>';
    }

    function renderConsolidated() {
      return DATA.sections.map(s => {
        const rows = s.rows.map(r => {
          const title = r.href
            ? '<a class="title" href="' + r.href + '">' + r.title + '</a>'
            : '<span class="title">' + r.title + '</span>';
          const note = r.note ? '<span class="note">, ' + r.note + '</span>' : '';
          return '<li>' + title + note + linksHtml(r.links) + '</li>';
        }).join('');
        return '<section class="project" id="' + s.id + '">' +
               '<h2>' + s.title + '</h2>' + depsHtml(s) +
               s.prose.map(p => '<p>' + p + '</p>').join('') +
               '<ul class="work">' + rows + '</ul></section>';
      }).join('');
    }

    /* ---------- timeline ---------- */
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const parseDate = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

    function mondayOf(d) {
      const t = new Date(d);
      t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
      return t;
    }
    const ymd = (d) => d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

    /* kinds kept in the data but not shown in the timeline */
    const HIDDEN_KINDS = new Set(['reorg']);

    function renderTimeline() {
      const entries = [...TIME.entries]
        .filter(e => !HIDDEN_KINDS.has(e.kind))
        .sort((a,b) => b.date.localeCompare(a.date));
      const weeks = new Map();
      for (const e of entries) {
        const key = ymd(mondayOf(parseDate(e.date)));
        if (!weeks.has(key)) weeks.set(key, new Map());
        const days = weeks.get(key);
        if (!days.has(e.date)) days.set(e.date, []);
        days.get(e.date).push(e);
      }

      return [...weeks.entries()].map(([wk, days]) => {
        const mon = parseDate(wk);
        const total = [...days.values()].reduce((n, a) => n + a.length, 0);
        const body = [...days.entries()].map(([date, list]) => {
          const d = parseDate(date);
          const head = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
          const items = list.map(e => {
            const ref = e.ref;
            const sec = ref && secById.get(ref.section);
            const row = ref && ref.row ? rowById.get(ref.section + '/' + ref.row) : null;
            let where;
            if (sec && row) {
              where = '<a href="#' + sec.id + '" data-goto="' + sec.id + '">' + sec.title + '</a>' +
                      '<span class="sep"> · </span>' +
                      (row.href ? '<a href="' + row.href + '">' + row.title + '</a>' : row.title);
            } else if (sec) {
              where = '<a href="#' + sec.id + '" data-goto="' + sec.id + '">' + sec.title + '</a>';
            } else if (ref) {
              where = ref.section + (ref.row ? ' / ' + ref.row : '');
            } else {
              where = 'The site';
            }
            return '<li>' +
              '<span class="kind" data-kind="' + (e.kind || '') + '">' + (e.kind || '') + '</span>' +
              '<span class="where">' + where + '</span>' +
              '<div class="entry-text">' + e.text + ' ' + (row ? linksHtml(row.links) : '') + '</div>' +
            '</li>';
          }).join('');
          return '<div class="day"><h3>' + head + '</h3><ul class="entries">' + items + '</ul></div>';
        }).join('');

        const id = 'week-' + wk;
        const seen = [...days.keys()].map(parseDate);
        const friday = new Date(mon); friday.setDate(friday.getDate() + 4);
        const latest = new Date(Math.max(...seen.map(d => d.getTime())));
        const end = latest > friday ? latest : friday;
        const fmt = d => MONTHS[d.getMonth()] + ' ' + d.getDate();
        const label = fmt(mon) + ' - ' + fmt(end);
        return '<section class="week" id="' + id + '"><h2>' + label + '</h2>' +
               '<p class="count">' + total + (total === 1 ? ' entry' : ' entries') + '</p>' +
               body + '</section>';
      }).join('');
    }

    /* ---------- presentations ---------- */
    function renderPresentations() {
      const items = [...PRES.entries]
        .sort((a,b) => b.date.localeCompare(a.date))
        .map(e => {
          const d = parseDate(e.date);
          const when = MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
          const sec = e.ref && secById.get(e.ref.section);
          const proj = sec
            ? '<span class="sep"> · </span><a href="#' + sec.id + '" data-goto="' + sec.id + '">' + sec.title + '</a>'
            : '';
          const title = e.href ? '<a href="' + e.href + '">' + e.title + '</a>' : e.title;
          return '<li id="' + e.id + '">' +
            '<span class="kind">' + when + '</span>' +
            '<span class="where">' + title + proj + '</span>' +
            (e.text ? '<div class="entry-text">' + e.text + linksHtml(e.links) + '</div>' : '') +
          '</li>';
        }).join('');
      return '<section class="project" id="presentations-list"><h2>Presentations</h2>' +
             '<ul class="entries">' + items + '</ul></section>';
    }

    function tocFor(view) {
      if (view === 'presentations') {
        return [...PRES.entries]
          .sort((a,b) => b.date.localeCompare(a.date))
          .map(e => '<li><a href="#' + e.id + '">' + e.title + '</a></li>').join('');
      }
      if (view === 'timeline') {
        return [...document.querySelectorAll('#view-timeline .week')].map(w =>
          '<li><a href="#' + w.id + '">' + w.querySelector('h2').textContent + '</a></li>').join('');
      }
      return DATA.sections.map(s => '<li><a href="#' + s.id + '">' + s.title + '</a></li>').join('');
    }

    /* ---------- wiring ---------- */
    document.getElementById('site-title').textContent = DATA.site.title;
    document.getElementById('site-tagline').textContent = DATA.site.tagline;
    document.getElementById('updated').textContent = DATA.site.updated;
    document.getElementById('view-consolidated').innerHTML = renderConsolidated();
    document.getElementById('view-timeline').innerHTML = renderTimeline();
    document.getElementById('view-presentations').innerHTML = renderPresentations();

    let observer = null;
    function spy(view) {
      observer?.disconnect();
      const links = [...document.querySelectorAll('nav.toc a')];
      const byId = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
      const seen = new Map();
      observer = new IntersectionObserver(entries => {
        for (const e of entries) seen.set(e.target.id, e);
        let best = null;
        for (const e of seen.values()) {
          if (!e.isIntersecting) continue;
          if (!best || e.boundingClientRect.top < best.boundingClientRect.top) best = e;
        }
        if (!best) return;
        links.forEach(a => a.classList.remove('active'));
        byId.get(best.target.id)?.classList.add('active');
      }, { rootMargin: '-10% 0px -70% 0px' });
      const sel = view === 'timeline' ? '#view-timeline .week'
        : view === 'presentations' ? '#view-presentations ul.entries li'
        : '#view-consolidated section.project';
      document.querySelectorAll(sel).forEach(s => observer.observe(s));
    }

    function setView(view, remember = true) {
      document.getElementById('view-consolidated').hidden = view !== 'consolidated';
      document.getElementById('view-timeline').hidden = view !== 'timeline';
      document.getElementById('view-presentations').hidden = view !== 'presentations';
      document.querySelectorAll('.viewbar button').forEach(b =>
        b.classList.toggle('active', b.dataset.view === view));
      document.getElementById('toc').innerHTML = tocFor(view);
      if (remember) try { localStorage.setItem('blog-view', view); } catch (e) {}
      spy(view);
    }

    document.querySelectorAll('.viewbar button').forEach(b =>
      b.addEventListener('click', () => setView(b.dataset.view)));

    /* a section link inside the timeline jumps to it in the consolidated view */
    document.addEventListener('click', (ev) => {
      const a = ev.target.closest('a[data-goto]');
      if (!a) return;
      ev.preventDefault();
      setView('consolidated');
      document.getElementById(a.dataset.goto)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    let initial = 'consolidated';
    try { initial = localStorage.getItem('blog-view') || 'consolidated'; } catch (e) {}
    if (location.hash.startsWith('#week-')) initial = 'timeline';
    if (location.hash.startsWith('#pres-')) initial = 'presentations';
    setView(initial, false);
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  </script>
