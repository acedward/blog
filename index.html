.live { font: 600 11px/1 var(--f-mono); text-transform: none; letter-spacing: .02em; color: var(--good); text-decoration: none; border: 1px solid currentColor; padding: 4px 7px; border-radius: 4px; }

.lb-box .svgwrap { background-color: var(--plate); background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 16px 16px; border-radius: 8px; aspect-ratio: 16 / 10; max-height: 82vh; width: 100%; }
.lb-box .svgwrap svg { width: 100%; height: 100%; }
.lb-cap { color: #e6e8f2; font: 500 13px/1.4 var(--f-mono); text-align: center; }

.n-box { fill: var(--plate); stroke: var(--line-strong); stroke-width: 1.4; }

.e-line { stroke: var(--ink-2); stroke-width: 1.5; fill: none; }

.e-txt { fill: var(--ink-2); font: 500 13px var(--f-mono); }
.e-tick { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2 3; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Schematic renderer ---------- */
const NS = 'http://www.w3.org/2000/svg';
function wrap(text, max) {
  const words = text.split(' ');
  const out = [];
  let cur = '';
  for (const w of words) {
    const next = cur ? cur + ' ' + w : w;
    if (next.length > max && cur) { out.push(cur); cur = w; } else { cur = next; }
  }
  if (cur) out.push(cur);
  return out;
}
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
let svgId = 0;
function schematic(flow, hl) {
  const nodes = flow.filter((_, i) => i % 2 === 0);
  const edges = flow.filter((_, i) => i % 2 === 1);
  const n = nodes.length;
  const nw = n <= 3 ? 150 : n === 4 ? 122 : 108;
  const gapMin = n <= 3 ? 80 : 46;
  const pad = 22;
  const W = Math.max(640, n * nw + (n - 1) * gapMin + pad * 2);
  const H = W * 10 / 16;
  const gap = (W - pad * 2 - n * nw) / (n - 1);
  const charsNode = Math.floor((nw - 18) / 8.1);
  const nodeLines = nodes.map(t => wrap(t, charsNode));
  const maxLines = Math.max(...nodeLines.map(l => l.length));
  const nh = Math.max(64, maxLines * 18 + 26);
  const cy = H * 0.58;
  const top = cy - nh / 2;
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': nodes.join(', then ') });
  const id = 'ah' + (svgId++);
  const defs = el('defs', {}, svg);
  const mk = el('marker', { id, viewBox: '0 0 10 10', refX: '9', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', class: 'e-head' }, mk);
  const charsEdge = Math.max(10, Math.floor((nw + gap - 14) / 7.9));
  nodes.forEach((t, i) => {
    const x = pad + i * (nw + gap);
    const isHl = i === hl;
    el('rect', { x, y: top, width: nw, height: nh, rx: 8, class: 'n-box' + (isHl ? ' hl' : '') }, svg);
    const lines = nodeLines[i];
    const t0 = cy - (lines.length - 1) * 9 + 5;
    lines.forEach((ln, j) => {
      const tx = el('text', { x: x + nw / 2, y: t0 + j * 18, 'text-anchor': 'middle', class: 'n-txt' + (isHl ? ' hl' : '') }, svg);
      tx.textContent = ln;
    });
    if (i < n - 1) {
      const x1 = x + nw + 4, x2 = x + nw + gap - 4;
      el('line', { x1, y1: cy, x2, y2: cy, class: 'e-line', 'marker-end': `url(#${id})` }, svg);
      const lab = edges[i];
      if (lab) {
        const mid = (x1 + x2) / 2;
        const ll = wrap(lab, charsEdge);
        const base = top - 18 - (ll.length - 1) * 15;
        ll.forEach((ln, j) => {
          const et = el('text', { x: mid, y: base + j * 15, 'text-anchor': 'middle', class: 'e-txt' }, svg);
          et.textContent = ln;
        });
        el('line', { x1: mid, y1: top - 12, x2: mid, y2: cy - 6, class: 'e-tick' }, svg);
      }
    }
  });
  return svg;
}

/* ---------- Helpers ---------- */
const lb = document.getElementById('lb');
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function openLightbox(content, cap) {
  lb.replaceChildren();
  const box = h('div', 'lb-box');
  box.appendChild(content);
  if (cap) box.appendChild(h('div', 'lb-cap', cap));
  lb.appendChild(box);
  lb.hidden = false;
}
function closeLightbox() { lb.hidden = true; lb.replaceChildren(); }
lb.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lb.hidden) closeLightbox(); });

function diagramPane(e) {
  const b = h('button', 'pane dia');
  b.type = 'button';
  b.setAttribute('aria-label', 'Enlarge diagram for ' + e.title);
  b.appendChild(schematic(e.flow, e.hl));
  b.appendChild(h('span', 'tag', 'Diagram'));
  b.addEventListener('click', () => {
    const w = h('div', 'svgwrap');
    w.appendChild(schematic(e.flow, e.hl));
    openLightbox(w, e.title + ' · diagram');
  });
  return b;
}

function backdrop(src) {
  const bg = h('span', 'bg');
  bg.setAttribute('aria-hidden', 'true');
  if (src) bg.style.backgroundImage = 'url("' + src + '")';
  return bg;
}

function mediaPane(e) {
  const m = e.media;
  if (!m) {
    const g = h('div', 'pane gap');
    const inner = h('div', 'gap-in');
    inner.appendChild(h('b', null, 'Video or screenshot to come'));
    g.appendChild(inner);
    return g;
  }
  if (m.kind === 'wallets') {
    const panel = h('div', 'pane wallet-support');
    for (const [key, label] of [['software', 'Software wallets'], ['hardware', 'Hardware wallets']]) {
      const group = h('div', key);
      const list = h('ul', 'wallet-list');
      m[key].forEach(name => list.appendChild(h('li', null, name)));
      group.append(h('h4', null, label), list);
      panel.appendChild(group);
    }
    return panel;
  }
  if (m.kind === 'deck') {
    const a = h('a', 'pane fit');
    a.href = m.href; a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', 'Open presentation: ' + e.title);
    a.appendChild(backdrop(m.src));
    const img = document.createElement('img');
    img.src = m.src; img.alt = e.title + ', title slide';
    a.append(img, h('span', 'tag', m.cap || 'Presentation'));
    return a;
  }
  if (m.kind === 'video') {
    const d = h('div', 'pane vid');
    d.appendChild(backdrop(m.poster));
    const v = document.createElement('video');
    v.src = m.src; v.poster = m.poster || ''; v.controls = true; v.preload = 'metadata';
    v.playsInline = true; v.muted = true;
    v.setAttribute('aria-label', e.title + ' video');
    d.appendChild(v);
    d.appendChild(h('span', 'tag', m.cap || 'Video'));
    return d;
  }
  if (m.kind === 'slides') {
    const d = h('div', 'pane slides');
    const bg = backdrop();
    d.appendChild(bg);
    let i = 0;
    const btn = h('button', 'slide');
    btn.type = 'button';
    const img = document.createElement('img');
    img.alt = e.title + ', slide 1 of ' + m.pages.length;
    btn.appendChild(img);
    btn.setAttribute('aria-label', 'Enlarge this slide');
    const count = h('span');
    const show = () => { img.src = m.pages[i]; bg.style.backgroundImage = 'url("' + m.pages[i] + '")'; img.alt = e.title + ', slide ' + (i + 1) + ' of ' + m.pages.length; count.textContent = (i + 1) + ' / ' + m.pages.length; };
    btn.addEventListener('click', () => { const big = document.createElement('img'); big.src = m.pages[i]; big.alt = img.alt; openLightbox(big, e.title + ' · slide ' + (i + 1)); });
    const nav = h('div', 'slide-nav');
    const prev = h('button', null, '‹'); prev.type = 'button'; prev.setAttribute('aria-label', 'Previous slide');
    const next = h('button', null, '›'); next.type = 'button'; next.setAttribute('aria-label', 'Next slide');
    prev.addEventListener('click', ev => { ev.stopPropagation(); i = (i + m.pages.length - 1) % m.pages.length; show(); });
    next.addEventListener('click', ev => { ev.stopPropagation(); i = (i + 1) % m.pages.length; show(); });
    nav.append(prev, count, next);
    d.append(btn, nav, h('span', 'tag', (m.cap || 'Slides') + ' · ' + m.pages.length));
    show();
    return d;
  }
  const b = h('button', 'pane fit');
  b.type = 'button';
  b.setAttribute('aria-label', 'Enlarge image of ' + e.title);
  b.appendChild(backdrop(m.src));
  const img = document.createElement('img');
  img.src = m.src; img.alt = m.alt || e.title + ' screenshot'; img.loading = 'lazy';
  b.appendChild(img);
  b.appendChild(h('span', 'tag', m.cap || 'Screenshot'));
  b.addEventListener('click', () => {
    const big = document.createElement('img');
    big.src = m.src; big.alt = img.alt;
    openLightbox(big, e.title);
  });
  return b;
}

function linkList(e) {
  const det = h('details', 'src');
  const count = e.links.filter(l => Array.isArray(l)).length;
  const sum = h('summary');
  sum.appendChild(document.createTextNode('Repos and links'));
  sum.appendChild(h('span', 'n', String(count)));
  det.appendChild(sum);
  const ul = h('ul', 'links');
  e.links.forEach(l => {
    if (!Array.isArray(l)) { ul.appendChild(h('li', 'grp', l.group)); return; }
    const li = h('li');
    li.appendChild(h('span', 'lk', l[0]));
    const a = h('a', null, l[1].replace('https://github.com/', '').replace('https://', ''));
    a.href = l[1]; a.target = '_blank'; a.rel = 'noopener';
    li.appendChild(a);
    ul.appendChild(li);
  });
  det.appendChild(ul);
  return det;
}

function head(e, kind) {
  const hd = h('div', 'plate-head');
  const meta = h('div', 'meta');
  if (kind === 'feature') meta.appendChild(h('span', null, 'Live on stagenet'));
  meta.appendChild(h('span', 'sp'));
  if (kind === 'feature') {
    const a = h('a', 'open-app', 'Open app ↗');
    a.href = e.app; a.target = '_blank'; a.rel = 'noopener';
    meta.appendChild(a);
  } else if (e.primary) {
    const a = h('a', 'open-app', e.primary[0]);
    a.href = e.primary[1]; a.target = '_blank'; a.rel = 'noopener';
    meta.appendChild(a);
  } else {
    const lv = e.links.find(l => Array.isArray(l) && l[0].startsWith('Live'));
    if (lv) { const a = h('a', 'live', 'Live ↗'); a.href = lv[1]; a.target = '_blank'; a.rel = 'noopener'; meta.appendChild(a); }
    else meta.classList.add('bare');
  }
  hd.appendChild(meta);
  hd.appendChild(h('h3', null, e.title));
  if (e.sub) hd.appendChild(h('div', 'sub', e.sub));
  return hd;
}

function plate(e, kind) {
  const art = h('article', 'plate' + (kind === 'feature' ? ' feature' : kind === 'compact' ? ' compact' : ''));
  art.id = e.id;
  if (kind === 'compact') {
    const body = h('div', 'body');
    body.append(head(e, kind), h('p', 'line', e.line), linkList(e));
    const c1 = h('div', 'cpane'); c1.appendChild(diagramPane(e));
    const c2 = h('div', 'cpane'); c2.appendChild(mediaPane(e));
    art.append(body, c1, c2);
    return art;
  }
  art.appendChild(head(e, kind));
  {
    const row = h('div', 'media');
    if (kind === 'feature') { row.appendChild(mediaPane(e)); row.appendChild(diagramPane(e)); }
    else { row.appendChild(diagramPane(e)); row.appendChild(mediaPane(e)); }
    art.appendChild(row);
  }
  art.appendChild(h('p', 'line', e.line));
  art.appendChild(linkList(e));
  return art;
}

function band(id, title, note, entries, kind, layout) {
  const s = h('section', 'band');
  s.id = id;
  const hd = h('div', 'band-head');
  hd.appendChild(h('h2', null, title));
  if (note) hd.appendChild(h('p', null, note));
  s.appendChild(hd);
  const list = h('div', layout);
  entries.forEach(e => list.appendChild(plate(e, kind)));
  s.appendChild(list);
  return s;
}

const SECTIONS = [
  ['featured', 'Featured', null, FEATURED, 'row', 'rows'],
  ['published', 'Published POC', 'Live on Midnight stagenet.', PUBLISHED, 'feature', 'rows'],
  ['projects', 'Projects', null, PROJECTS, 'row', 'rows'],
  ['other', 'Other projects and support', null, OTHER, 'compact', 'rows tight']
];
const main = document.getElementById('main');
SECTIONS.forEach(([id, title, note, entries, kind, layout]) => main.appendChild(band(id, title, note, entries, kind, layout)));

</script>
